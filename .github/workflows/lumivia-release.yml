name: Lumivia Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumivia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'goldenfishs/sub2api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify deployment safeguards
        run: python3 deploy/tests/lumivia-update-test.py
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify custom behavior before publishing
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          tests=$(go test -tags=unit ./internal/service -list 'TestWeeklyAdvance|TestLumivia')
          grep -q '^TestWeeklyAdvanceCalculation$' <<< "$tests"
          grep -q '^TestWeeklyAdvanceAutomaticRechecksStoredOptIn$' <<< "$tests"
          grep -q '^TestLumiviaUpdatesUseFork$' <<< "$tests"
          go test -tags=unit ./internal/service -run 'TestWeeklyAdvance|TestValidateAndCheckLimits|TestLumivia|TestUpdateService' -count=1
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm run build

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < backend/cmd/server/VERSION)-lumivia.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/goldenfishs/sub2api:sha-${{ github.sha }}
            ghcr.io/goldenfishs/sub2api:lumivia-latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/goldenfishs/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lumivia-amd64
          cache-to: type=gha,mode=max,scope=lumivia-amd64
