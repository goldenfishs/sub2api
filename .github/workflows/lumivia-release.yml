name: Lumivia Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumivia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'goldenfishs/sub2api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify deployment safeguards
        run: python3 deploy/tests/lumivia-update-test.py
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify custom behavior before publishing
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          tests=$(go test -tags=unit ./internal/service -list 'TestWeeklyAdvance|TestMonthlyAdvance|TestLumivia')
          grep -q '^TestWeeklyAdvanceCalculation$' <<< "$tests"
          grep -q '^TestWeeklyAdvanceAutomaticRechecksStoredOptIn$' <<< "$tests"
          grep -q '^TestWeeklyAdvanceMonthlyLimitAfterShift$' <<< "$tests"
          grep -q '^TestWeeklyAdvanceRepeatedMonthlyShift$' <<< "$tests"
          grep -q '^TestMonthlyAdvanceCalculation$' <<< "$tests"
          grep -q '^TestMonthlyAdvanceEligibility$' <<< "$tests"
          grep -q '^TestMonthlyAdvanceOwnershipAndReplay$' <<< "$tests"
          grep -q '^TestMonthlyAdvanceWeeklyClock$' <<< "$tests"
          grep -q '^TestLumiviaUpdatesUseFork$' <<< "$tests"
          go test -tags=unit ./internal/service -run 'TestWeeklyAdvance|TestMonthlyAdvance|TestValidateAndCheckLimits|TestLumivia|TestUpdateService' -count=1
          go test -tags=unit ./internal/handler -run '^TestMonthlyAdvanceHandler' -count=1
          go test -tags=unit ./internal/handler/dto -run '^TestUserSubscriptionFromServiceMonthlyResetAt$' -count=1
          go test -tags=unit ./internal/handler/dto -run '^TestPublicSettingsInjectionPayload_SchemaDoesNotDrift$' -count=1
          go test -tags=unit ./internal/server -run '^TestAPIContracts$' -count=1
          go test -tags=unit ./internal/repository -run '^TestUserSubscriptionGetByIDForUpdateLocksRow$' -count=1
          go test -tags=unit ./internal/pkg/modelcheckbridge ./internal/config ./internal/server/middleware ./internal/server/routes ./internal/service -run ModelCheck -count=1
      - name: Verify upstream quota, pricing and stream compatibility
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -tags=unit ./internal/service -run 'TestGPT61Sol|TestGPT6|TestNormalizeCodex|TestNormalizeOpenAI|Test.*OpenAIAutoReset|TestOpenAIQuotaAutoResetService|TestClaudeReset|TestEvaluateAccountSchedulingThreshold|TestEvaluateAnthropicFableSchedulingThreshold|TestOpenAIGatewayService_SelectAccountWithScheduler|TestNewModelPricing|TestGetModelPricing|TestCalculateCost|TestResolveAccountStatsCost|TestTryModelFilePricing|TestAnthropicChatStreamAuthoritativeUsage|TestTransportErrorHandlers_ClientDisconnect|TestAntigravityCompatTransportError_ClientDisconnect|TestAntigravityWriteGoogleError_ClientClosed' -count=1
          go test -tags=unit ./internal/pkg/openai ./internal/pkg/apicompat ./internal/pkg/antigravity ./internal/pkg/googleapi -count=1
          go test -tags=unit ./internal/handler -run 'TestGatewayHandlerPreCancelled|TestGatewayEnsureForwardErrorResponse|TestGeminiV1BetaModels_ClientCancel|TestGatewayChatCompletions_GeminiClientCancel|TestOpenAIResponsesWebSocket_Composite' -count=1
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/views/user/__tests__/SubscriptionsView.advanceMonth.spec.ts src/utils/__tests__/featureFlags.spec.ts src/components/modelCheck/__tests__ src/components/keys/__tests__/UseKeyModal.spec.ts src/composables/__tests__/useModelWhitelist.spec.ts src/components/modelPlaza/__tests__/PlazaModelPricingTable.spec.ts src/utils/__tests__/codexCatalogConfig.spec.ts
          pnpm run build

  verify-model-check:
    if: github.repository == 'goldenfishs/sub2api'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify companion Compose boundaries
        run: python3 deploy/tests/model-check-compose-test.py
      - uses: docker/setup-buildx-action@v3
      - name: Install locked dependencies and build browser test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: extensions/model-check/Dockerfile
          target: test
          platforms: linux/amd64
          load: true
          tags: lumivia-model-check:ci-test
          cache-from: type=gha,scope=lumivia-model-check-amd64
          cache-to: type=gha,mode=max,scope=lumivia-model-check-amd64
      - name: Run all model-check tests with real offline Chromium rendering
        run: |
          docker run --rm --init --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --cpus 2 --memory 1g --memory-swap 1g --pids-limit 256 --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=268435456,mode=1777 \
            lumivia-model-check:ci-test
      - name: Build production companion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: extensions/model-check/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: lumivia-model-check:ci-runtime
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=lumivia-model-check-amd64
      - name: Verify production startup and persistent encrypted data
        run: bash extensions/model-check/test/container-smoke.sh lumivia-model-check:ci-runtime

  publish:
    needs: [verify, verify-model-check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < backend/cmd/server/VERSION)-lumivia.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/goldenfishs/sub2api:sha-${{ github.sha }}
            ghcr.io/goldenfishs/sub2api:lumivia-latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/goldenfishs/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lumivia-amd64
          cache-to: type=gha,mode=max,scope=lumivia-amd64
      - name: Publish model-check companion from the same commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: extensions/model-check/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/goldenfishs/sub2api-model-check:sha-${{ github.sha }}
            ghcr.io/goldenfishs/sub2api-model-check:lumivia-latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/goldenfishs/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lumivia-model-check-amd64
          cache-to: type=gha,mode=max,scope=lumivia-model-check-amd64
      - name: Export deployable image archive
        env:
          IMAGE: ghcr.io/goldenfishs/sub2api:sha-${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > /tmp/lumivia-image.tar.gz
          cd /tmp
          sha256sum lumivia-image.tar.gz > lumivia-image.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: lumivia-image-${{ github.sha }}
          path: |
            /tmp/lumivia-image.tar.gz
            /tmp/lumivia-image.tar.gz.sha256
          compression-level: 0
          retention-days: 30
      - name: Export deployable model-check image archive
        env:
          IMAGE: ghcr.io/goldenfishs/sub2api-model-check:sha-${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > /tmp/lumivia-model-check-image.tar.gz
          cd /tmp
          sha256sum lumivia-model-check-image.tar.gz > lumivia-model-check-image.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: lumivia-model-check-image-${{ github.sha }}
          path: |
            /tmp/lumivia-model-check-image.tar.gz
            /tmp/lumivia-model-check-image.tar.gz.sha256
          compression-level: 0
          retention-days: 30
